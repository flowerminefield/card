<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle • a04.org</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');
        
        body {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
        }
        
        .accent-gradient {
            background: linear-gradient(90deg, #a855f7, #ec4899, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-auto p-8">
        <div class="border border-zinc-800 rounded-md p-10 text-center">
            <!-- Name -->
            <h1 class="text-5xl font-bold tracking-tighter mb-2 accent-gradient">Waffle</h1>
            <p class="text-zinc-400 mb-8">@a04.org</p>

            <!-- Flags -->
            <div class="flex justify-center gap-6 text-5xl mb-10">
                🇦🇺 <span class="text-4xl">🏳️‍⚧️</span>
            </div>

            <!-- Bio -->
            <p class="text-zinc-300 mb-10 leading-relaxed">
                I am Waffle.<br>
                Developer, tinkerer, and professional shitposter.
            </p>

            <!-- Contact -->
            <div class="space-y-4 text-left max-w-xs mx-auto">
                <a href="mailto:waffle@a04.org" 
                   class="block hover:text-purple-400 flex items-center gap-3 text-lg">
                    <i class="fas fa-envelope w-5"></i>
                    waffle@a04.org
                </a>
                
                <a href="https://github.com/yourusername" target="_blank" 
                   class="block hover:text-purple-400 flex items-center gap-3 text-lg">
                    <i class="fab fa-github w-5"></i>
                    GitHub
                </a>
            </div>

            <div class="mt-12 pt-8 border-t border-zinc-800 text-xs text-zinc-500">
                card.a04.org
            </div>
        </div>
    </div>
</body>
</html>
